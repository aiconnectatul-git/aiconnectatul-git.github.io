<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>Dev Tools — Base64, JWT, JSON, Time & more</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1220;--panel:#111c2e;--panel2:#0d1727;--line:rgba(174,196,226,.13);--text:#f2f6fc;--muted:#8a9bb3;--mint:#8ce4c0;--blue:#9bb8ff;--bad:#ff8f9c;--warn:#ffd28a;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}html{color-scheme:dark}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:15px/1.5 "DM Sans",system-ui,sans-serif;padding:24px 20px 60px;position:relative;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;border-radius:50%;filter:blur(110px);opacity:.16;pointer-events:none;z-index:-1}
body:before{width:460px;height:460px;background:#286e9e;top:-120px;right:-120px}
body:after{width:400px;height:400px;background:#236c59;bottom:-140px;left:-140px}
.wrap{max-width:1180px;margin:0 auto}
.back{color:var(--mint);text-decoration:none;font-size:13px;font-weight:700}.back:hover{text-decoration:underline}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);gap:26px;margin-top:22px;align-items:start}
.side{position:sticky;top:20px;background:linear-gradient(160deg,#142238,#0f1a2b);border:1px solid var(--line);border-radius:22px;padding:14px}
.brand{display:flex;gap:12px;align-items:center;padding:6px 8px 16px}
.mark{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#8ce4c0,#9bb8ff);color:#0b1f1a;font:700 15px var(--mono);letter-spacing:-1px}
.brand b{font:700 19px "Space Grotesk";letter-spacing:-.8px;display:block;line-height:1.1}
.brand small{font-size:9px;letter-spacing:1.8px;font-weight:700;color:var(--mint)}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:12px;color:#aab8cc;text-decoration:none;font-weight:600;font-size:13.5px;transition:.15s}
.nav a i{font:500 11px var(--mono);font-style:normal;width:30px;height:26px;border-radius:8px;background:#ffffff0a;display:grid;place-items:center;color:var(--muted);transition:.15s;flex-shrink:0}
.nav a:hover{background:#ffffff08;color:#fff}
.nav a.on{background:#8ce4c01a;color:var(--mint)}.nav a.on i{background:var(--mint);color:#0b1f1a}
.main{min-width:0}
.thead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.kicker{font-size:10px;letter-spacing:2px;font-weight:700;color:var(--mint)}
h1{font:700 clamp(28px,5vw,38px)/1.05 "Space Grotesk";letter-spacing:-1.5px;margin:5px 0 6px}
.desc{color:var(--muted);font-size:13.5px;margin:0}
.seg{position:relative;display:inline-grid;grid-template-columns:1fr 1fr;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{position:relative;z-index:1;background:none;border:0;color:var(--muted);font:600 14px "DM Sans";padding:10px 24px;cursor:pointer;border-radius:10px;transition:color .2s}
.seg button[aria-selected=true]{color:#0b1f1a}
.seg i{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:10px;background:var(--mint);transition:transform .28s cubic-bezier(.4,.1,.2,1)}
.seg[data-v="1"] i{transform:translateX(100%)}
.stage{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch}
.stage.two{grid-template-columns:1fr 1fr}.stage.one{grid-template-columns:1fr}
.card{background:linear-gradient(160deg,#142238,#0f1a2b);border:1px solid var(--line);border-radius:22px;display:flex;flex-direction:column;min-width:0;transition:border-color .2s,box-shadow .2s}
.card:focus-within{border-color:#8ce4c055;box-shadow:0 0 0 4px #8ce4c012}
.card.drag{border-color:var(--mint);box-shadow:0 0 0 4px #8ce4c022}
.card.err{border-color:#ff8f9c66}
.chead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 0;flex-wrap:wrap}
.label{font-size:10px;letter-spacing:1.6px;font-weight:700;color:var(--muted)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#ffffff0a;border:1px solid var(--line);color:#c9d6e8;border-radius:9px;font:600 11.5px "DM Sans";padding:6px 11px;cursor:pointer;transition:.15s;display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.chip:hover{border-color:#8ce4c066;color:var(--mint)}.chip:disabled{opacity:.35;pointer-events:none}
.chip.on{background:var(--mint);border-color:var(--mint);color:#0b1f1a}
textarea,.out{flex:1;min-height:260px;width:100%;resize:none;background:transparent;border:0;outline:0;color:var(--text);font:400 13.5px/1.7 var(--mono);padding:14px 18px;word-break:break-all;white-space:pre-wrap;overflow:auto;margin:0}
textarea::placeholder{color:#5d6e86}
.ro{color:var(--mint)}
.cfoot{display:flex;justify-content:space-between;gap:10px;padding:12px 18px 15px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);min-height:46px}
.cfoot b{color:#dbe6f5;font-weight:600}.msg.bad{color:var(--bad)}.msg.good{color:var(--mint)}
.mid{display:flex;align-items:center}
.swap{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--mint);font-size:18px;cursor:pointer;transition:.25s}
.swap:hover{transform:rotate(180deg);border-color:#8ce4c066}
.opts{display:flex;gap:22px;flex-wrap:wrap;align-items:center;margin-top:18px;color:var(--muted);font-size:13px}
.sw{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none}.sw input{display:none}
.sw span{width:34px;height:20px;border-radius:99px;background:#26364e;position:relative;transition:.2s}
.sw span:after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#9db0c9;transition:.2s}
.sw input:checked+span{background:var(--mint)}.sw input:checked+span:after{left:17px;background:#0b1f1a}
.hint{margin-left:auto;font-size:12px;color:#5d6e86}
.field{background:var(--panel2);border:1px solid var(--line);border-radius:12px;color:var(--text);font:500 13.5px var(--mono);padding:10px 12px;outline:0;min-width:0}
.field:focus{border-color:#8ce4c066}select.field{font-family:"DM Sans";font-weight:600;cursor:pointer}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;padding:13px 18px;border-top:1px solid var(--line);cursor:pointer;transition:background .15s}
.row:first-child{border-top:0}.row:hover{background:#ffffff06}
.row .k{width:118px;flex-shrink:0;font-size:10px;letter-spacing:1.4px;font-weight:700;color:var(--muted)}
.row .v{flex:1;font:500 13.5px var(--mono);color:var(--mint);word-break:break-all;min-width:0}
.row .c{font-size:11px;color:#5d6e86;opacity:0;transition:.15s}.row:hover .c{opacity:1}
.pad{padding:18px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}.stack>*{min-width:0}
.badge{display:inline-block;font:700 10px "DM Sans";letter-spacing:1px;padding:3px 8px;border-radius:99px;background:#8ce4c022;color:var(--mint);margin-left:8px;vertical-align:middle}
.badge.bad{background:#ff8f9c22;color:var(--bad)}.badge.warn{background:#ffd28a22;color:var(--warn)}
.stack{display:flex;flex-direction:column;gap:14px}
mark{background:#8ce4c033;color:var(--mint);border-radius:4px;padding:0 1px}
.hl{color:#dbe6f5}
.tok{color:var(--blue)}
/* Full-height tools (JSON): panes stretch to fill the viewport */
body:has(.main.fill){padding-bottom:18px}
.main.fill{display:flex;flex-direction:column;height:calc(100vh - 112px);min-height:460px}
.main.fill .thead{flex:none;margin-bottom:16px}.main.fill .opts{flex:none}
.main.fill .stage{flex:1;min-height:0;grid-template-rows:minmax(0,1fr)}
.main.fill .card{min-height:0}.main.fill textarea{min-height:0;overflow:auto}
@media(max-width:860px){.main.fill{height:auto;min-height:0}.main.fill .stage{grid-template-rows:none}.main.fill textarea{min-height:190px}.main.fill .klist{min-height:140px}body:has(.main.fill){padding-bottom:60px}}
.stage.k3{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 250px}
.klist{flex:1;min-height:0;overflow:auto;padding:8px 6px}
.krow{display:flex;align-items:center;gap:9px;padding:5px 8px;border-radius:8px;cursor:pointer;font:500 12.5px var(--mono);color:#dbe6f5;transition:background .12s}
.krow:hover{background:#ffffff08}.krow.dim{opacity:.4}
.krow input{accent-color:#8ce4c0;width:15px;height:15px;flex-shrink:0;margin:0}
.krow .kn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.krow .kc{margin-left:auto;font-size:10px;color:var(--muted)}
.kempty{padding:14px;color:#5d6e86;font-size:12.5px}
@media(max-width:860px){.stage.k3{grid-template-columns:minmax(0,1fr)}.klist{max-height:240px}}
.pvwrap{flex:1;min-height:260px;margin:14px 18px 14px;border-radius:12px;background:#fff;overflow:auto;display:flex;justify-content:center;background-image:linear-gradient(45deg,#f1f3f7 25%,transparent 25%,transparent 75%,#f1f3f7 75%),linear-gradient(45deg,#f1f3f7 25%,transparent 25%,transparent 75%,#f1f3f7 75%);background-size:16px 16px;background-position:0 0,8px 8px}
.pvwrap iframe{width:100%;height:100%;min-height:260px;border:0;background:#fff;transition:width .25s;box-shadow:0 0 0 1px #0000000f}
.main.fill .pvwrap{min-height:0}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--mint);color:#0b1f1a;font-weight:700;font-size:13px;padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);gap:16px}.side{min-width:0}
  .side{position:static;padding:10px;border-radius:18px}.brand{display:none}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}
  .nav a{white-space:nowrap;padding:8px 12px}.nav a i{display:none}
  .stage,.stage.two{grid-template-columns:minmax(0,1fr)}.mid{justify-content:center;margin:-4px 0}.swap{transform:rotate(90deg)}.swap:hover{transform:rotate(270deg)}
  textarea,.out{min-height:190px}.hint{display:none}.grid2{grid-template-columns:minmax(0,1fr)}
  .row{flex-wrap:wrap;gap:4px}.row .k{width:100%}
  textarea,.field{font-size:16px}
}
</style></head>
<body><div class="wrap">
<a class="back" href="../../../index.html">← Back to tools</a>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="mark">&lt;/&gt;</div><div><small>DEVELOPER</small><b>Dev Tools</b></div></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main class="main" id="main"></main>
</div></div>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let tt;function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),1600)}
const copyText=async t=>{try{await navigator.clipboard.writeText(t);toast("Copied to clipboard")}catch(e){toast("Copy not allowed here")}};
const fmtB=n=>n<1024?n+" B":n<1048576?(n/1024).toFixed(1)+" KB":(n/1048576).toFixed(2)+" MB";
let cleanup=()=>{};

/* ---------- UI builders ---------- */
const chip=(id,label,cls="")=>`<button class="chip ${cls}" id="${id}">${label}</button>`;
const pane=(id,label,o={})=>`<section class="card" id="${id}Card"><div class="chead"><span class="label" id="${id}Label">${label}</span><div class="tools">${o.tools||""}</div></div>${o.ro?`<div class="out ro" id="${id}"></div>`:`<textarea id="${id}" spellcheck="false" placeholder="${o.ph||""}"></textarea>`}<div class="cfoot"><span id="${id}Stat"></span><span class="msg" id="${id}Msg"></span></div></section>`;
const seg=(a,b,v=0)=>`<div class="seg" id="seg" data-v="${v}"><i></i><button data-v="0" aria-selected="${v==0}">${a}</button><button data-v="1" aria-selected="${v==1}">${b}</button></div>`;
const sw=(id,label,on)=>`<label class="sw"><input type="checkbox" id="${id}" ${on?"checked":""}><span></span>${label}</label>`;
const head=t=>`<div class="thead"><div><div class="kicker">DEV TOOLS</div><h1>${t.name}</h1><p class="desc">${t.desc}</p></div>${t.head?t.head:""}</div>`;
const setVal=(id,v)=>{const e=$(id);if("value" in e)e.value=v;else e.textContent=v};
const getVal=id=>{const e=$(id);return "value" in e?e.value:e.textContent};
const stat=(id,h)=>$(id+"Stat").innerHTML=h;
const msg=(id,t,cls)=>{const m=$(id+"Msg");m.textContent=t||"";m.className="msg "+(cls||"");$(id+"Card").classList.toggle("err",cls==="bad")};
function wireSeg(cb){const s=$("seg");s.querySelectorAll("button").forEach(b=>b.onclick=()=>{s.dataset.v=b.dataset.v;s.querySelectorAll("button").forEach(x=>x.setAttribute("aria-selected",x===b));cb(+b.dataset.v)})}
function rows(el,list){el.innerHTML=list.map(([k,v,x])=>`<div class="row" data-v="${esc(v)}"><span class="k">${k}</span><span class="v">${esc(v)}${x||""}</span><span class="c">COPY</span></div>`).join("");el.querySelectorAll(".row").forEach(r=>r.onclick=()=>copyText(r.dataset.v))}
const bind=(id,fn)=>$(id).addEventListener("input",fn);
const onclick=(id,fn)=>{const e=$(id);if(e)e.onclick=fn};

/* ---------- TOOLS ---------- */
const TOOLS=[];

/* Base64 */
TOOLS.push({id:"base64",ico:"64",name:"Base64",desc:"Encode and decode text or files. UTF-8 safe, URL-safe option, runs locally.",
render(){
  const S={mode:0,bytes:null,name:"",out:null};
  const dec=new TextDecoder("utf-8",{fatal:true});
  $("main").innerHTML=head({...this,head:seg("Encode","Decode")})+`<div class="stage">${pane("i","TEXT",{ph:"Type or paste text — or drop a file here",tools:chip("file","↑ File")+chip("paste","Paste")+chip("clear","Clear")})}<div class="mid"><button class="swap" id="swap" aria-label="Swap">⇄</button></div>${pane("o","BASE64",{tools:chip("dl","↓ Save")+chip("copy","Copy")}).replace("<textarea","<textarea readonly")}</div>
  <div class="opts">${sw("url","URL-safe")}${sw("wrap","Wrap at 76")}${sw("pad","Padding “=”",1)}<span class="hint">Runs entirely in your browser</span></div><input type="file" id="fileIn" hidden>`;
  const toB64=b=>{let s="";for(let i=0;i<b.length;i+=8192)s+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(s)};
  const fromB64=s=>{const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a};
  function run(){const v=getVal("i");let out="";S.out=null;msg("i","");let ok=true;
    try{if(!S.mode){const bytes=S.bytes||new TextEncoder().encode(v);out=(v||S.bytes)?toB64(bytes):"";
        if($("url").checked)out=out.replace(/\+/g,"-").replace(/\//g,"_");if(!$("pad").checked)out=out.replace(/=+$/,"");if($("wrap").checked)out=out.replace(/(.{76})/g,"$1\n").trim();
        stat("i",S.bytes?`<b>${esc(S.name)}</b> · ${fmtB(S.bytes.length)}`:`<b>${v.length}</b> chars · ${fmtB(bytes.length)}`);
        stat("o",`<b>${out.length}</b> chars`+(out&&bytes.length?` · <b>+${Math.round((out.length/bytes.length-1)*100)}%</b>`:""))}
      else{let c=v.replace(/\s+/g,"").replace(/-/g,"+").replace(/_/g,"/");
        if(c){if(/[^A-Za-z0-9+/=]/.test(c))throw 0;c=c.replace(/=+$/,"");if(c.length%4===1)throw 0;c+="=".repeat((4-c.length%4)%4);const bytes=fromB64(c);S.out=bytes;
          try{out=dec.decode(bytes)}catch(e){msg("i","Binary data — use Save to download.","good")}}
        stat("i",`<b>${v.length}</b> chars`);stat("o",`<b>${out.length}</b> chars`+(S.out?` · <b>${fmtB(S.out.length)}</b>`:""))}
    }catch(e){ok=false;msg("i","That doesn’t look like valid Base64.","bad");setVal("o","");stat("o","")}
    if(ok)setVal("o",out);$("copy").disabled=!out;$("dl").disabled=!(out||S.out)||!ok}
  function mode(m){S.mode=m;S.bytes=null;$("seg").dataset.v=m;$("seg").querySelectorAll("button").forEach(b=>b.setAttribute("aria-selected",+b.dataset.v===m));
    $("iLabel").textContent=m?"BASE64":"TEXT";$("oLabel").textContent=m?"TEXT":"BASE64";$("i").placeholder=m?"Paste a Base64 string — or drop a .txt file":"Type or paste text — or drop a file here";run()}
  wireSeg(mode);bind("i",()=>{S.bytes=null;run()});["url","wrap","pad"].forEach(i=>$(i).onchange=run);
  onclick("swap",()=>{const o=getVal("o");mode(S.mode?0:1);setVal("i",o);run()});
  onclick("clear",()=>{setVal("i","");S.bytes=null;run();$("i").focus()});
  onclick("paste",async()=>{try{setVal("i",await navigator.clipboard.readText());S.bytes=null;run()}catch(e){toast("Allow clipboard access to paste")}});
  onclick("copy",()=>copyText(getVal("o")));onclick("file",()=>$("fileIn").click());$("fileIn").onchange=e=>load(e.target.files[0]);
  async function load(f){if(!f)return;const buf=new Uint8Array(await f.arrayBuffer());if(!S.mode){S.bytes=buf;S.name=f.name;setVal("i","");run()}else{setVal("i",new TextDecoder().decode(buf).trim());run()}}
  onclick("dl",()=>{const d=S.mode?S.out:getVal("o");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([d]));a.download=S.mode?"decoded.bin":"encoded.txt";a.click();URL.revokeObjectURL(a.href)});
  const card=$("iCard");["dragenter","dragover"].forEach(t=>card.addEventListener(t,e=>{e.preventDefault();card.classList.add("drag")}));["dragleave","drop"].forEach(t=>card.addEventListener(t,e=>{e.preventDefault();card.classList.remove("drag")}));card.addEventListener("drop",e=>load(e.dataTransfer.files[0]));
  run()}});

/* Text Case */
TOOLS.push({id:"case",ico:"Aa",name:"Text Case",desc:"Convert text between UPPER, lower, Title, camelCase, snake_case and more.",
render(){
  const words=s=>s.replace(/([a-z0-9])([A-Z])/g,"$1 $2").replace(/([A-Z]+)([A-Z][a-z])/g,"$1 $2").split(/[^A-Za-z0-9À-ɏ]+/).filter(Boolean);
  const cap=w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase();
  const C=[["upper","UPPER CASE",s=>s.toUpperCase()],["lower","lower case",s=>s.toLowerCase()],["title","Title Case",s=>s.toLowerCase().replace(/(^|[\s\-—(])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase())],
    ["sentence","Sentence case",s=>s.toLowerCase().replace(/(^\s*\p{L}|[.!?]\s+\p{L})/gu,c=>c.toUpperCase())],["camel","camelCase",s=>{const w=words(s);return w.map((x,i)=>i?cap(x):x.toLowerCase()).join("")}],
    ["pascal","PascalCase",s=>words(s).map(cap).join("")],["snake","snake_case",s=>words(s).map(x=>x.toLowerCase()).join("_")],["kebab","kebab-case",s=>words(s).map(x=>x.toLowerCase()).join("-")],
    ["constant","CONSTANT_CASE",s=>words(s).map(x=>x.toUpperCase()).join("_")],["dot","dot.case",s=>words(s).map(x=>x.toLowerCase()).join(".")],
    ["alt","aLtErNaTiNg",s=>[...s].map((c,i)=>i%2?c.toUpperCase():c.toLowerCase()).join("")],["rev","Reverse",s=>[...s].reverse().join("")]];
  let cur="title";
  $("main").innerHTML=head(this)+`<div class="card" style="margin-bottom:14px"><div class="chead" style="padding-bottom:16px"><div class="tools">${C.map(c=>chip("c_"+c[0],c[1],c[0]===cur?"on":"")).join("")}</div></div></div>
  <div class="stage two">${pane("i","INPUT",{ph:"Type or paste your text…",tools:chip("clear","Clear")})}${pane("o","RESULT",{tools:chip("copy","Copy")}).replace("<textarea","<textarea readonly")}</div>`;
  const run=()=>{const v=getVal("i");const r=C.find(c=>c[0]===cur)[2](v);setVal("o",r);stat("i",`<b>${v.length}</b> chars · <b>${(v.match(/\S+/g)||[]).length}</b> words · <b>${v?v.split("\n").length:0}</b> lines`);stat("o",`<b>${r.length}</b> chars`);$("copy").disabled=!r};
  C.forEach(c=>$("c_"+c[0]).onclick=()=>{cur=c[0];C.forEach(x=>$("c_"+x[0]).classList.toggle("on",x[0]===cur));run()});
  bind("i",run);onclick("clear",()=>{setVal("i","");run();$("i").focus()});onclick("copy",()=>copyText(getVal("o")));run()}});

/* URL */
TOOLS.push({id:"url",ico:"%",name:"URL Encode / Decode",desc:"Percent-encode or decode strings and URLs, and inspect query parameters.",
render(){
  let m=0;

function mount(){const id=(location.hash||"#base64").slice(1);const t=TOOLS.find(x=>x.id===id)||TOOLS[0];cleanup();cleanup=()=>{};
  $("nav").innerHTML=TOOLS.map(x=>`<a href="#${x.id}" class="${x===t?"on":""}"><i>${esc(x.ico)}</i>${x.name}</a>`).join("");
  $("main").classList.toggle("fill",!!t.fill);t.render();document.title=t.name+" — Dev Tools";localStorage.setItem("devtools_last",t.id)}
addEventListener("hashchange",()=>{mount();scrollTo({top:0})});
if(!location.hash){const l=localStorage.getItem("devtools_last");if(l&&TOOLS.some(x=>x.id===l))history.replaceState(null,"","#"+l)}
mount();
</script></body></html>
