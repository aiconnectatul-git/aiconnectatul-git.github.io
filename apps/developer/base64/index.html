<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>Base64 — Encode & Decode</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1220;--panel:#111c2e;--panel2:#0d1727;--line:rgba(174,196,226,.13);--text:#f2f6fc;--muted:#8a9bb3;--mint:#8ce4c0;--blue:#9bb8ff;--bad:#ff8f9c;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}html{color-scheme:dark}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:15px/1.5 "DM Sans",system-ui,sans-serif;padding:28px 20px 60px;position:relative;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;border-radius:50%;filter:blur(110px);opacity:.16;pointer-events:none;z-index:-1}
body:before{width:460px;height:460px;background:#286e9e;top:-120px;right:-120px}
body:after{width:400px;height:400px;background:#236c59;bottom:-140px;left:-140px}
.wrap{max-width:1040px;margin:0 auto}
.back{color:var(--mint);text-decoration:none;font-size:13px;font-weight:700}
.back:hover{text-decoration:underline}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin:34px 0 26px}
.title{display:flex;gap:16px;align-items:center}
.mark{width:56px;height:56px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(145deg,#8ce4c0,#9bb8ff);color:#0b1f1a;font:700 19px var(--mono);letter-spacing:-1px;box-shadow:0 10px 30px #8ce4c026}
.kicker{font-size:10px;letter-spacing:2px;font-weight:700;color:var(--mint)}
h1{font:700 clamp(28px,5vw,38px)/1.05 "Space Grotesk";letter-spacing:-1.5px;margin:5px 0 0}
.seg{position:relative;display:inline-grid;grid-template-columns:1fr 1fr;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{position:relative;z-index:1;background:none;border:0;color:var(--muted);font:600 14px "DM Sans";padding:10px 26px;cursor:pointer;border-radius:10px;transition:color .2s}
.seg button[aria-selected=true]{color:#0b1f1a}
.seg i{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:10px;background:var(--mint);transition:transform .28s cubic-bezier(.4,.1,.2,1)}
.seg[data-mode=decode] i{transform:translateX(100%)}
.stage{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch}
.card{background:linear-gradient(160deg,#142238,#0f1a2b);border:1px solid var(--line);border-radius:22px;display:flex;flex-direction:column;min-width:0;transition:border-color .2s,box-shadow .2s}
.card:focus-within{border-color:#8ce4c055;box-shadow:0 0 0 4px #8ce4c012}
.card.drag{border-color:var(--mint);box-shadow:0 0 0 4px #8ce4c022}
.card.err{border-color:#ff8f9c66}
.chead{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 0}
.label{font-size:10px;letter-spacing:1.6px;font-weight:700;color:var(--muted)}
.tools{display:flex;gap:6px}
.chip{background:#ffffff0a;border:1px solid var(--line);color:#c9d6e8;border-radius:9px;font:600 11px "DM Sans";padding:6px 10px;cursor:pointer;transition:.15s;display:inline-flex;gap:5px;align-items:center}
.chip:hover{border-color:#8ce4c066;color:var(--mint)}
.chip:disabled{opacity:.35;pointer-events:none}
textarea{flex:1;min-height:300px;width:100%;resize:none;background:transparent;border:0;outline:0;color:var(--text);font:400 13.5px/1.7 var(--mono);padding:14px 18px;word-break:break-all}
textarea::placeholder{color:#5d6e86}
#out{color:var(--mint)}
.cfoot{display:flex;justify-content:space-between;gap:10px;padding:12px 18px 15px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);min-height:46px}
.cfoot b{color:#dbe6f5;font-weight:600}
.msg.bad{color:var(--bad)}
.mid{display:flex;align-items:center}
.swap{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--mint);font-size:18px;cursor:pointer;transition:.25s}
.swap:hover{transform:rotate(180deg);border-color:#8ce4c066}
.opts{display:flex;gap:22px;flex-wrap:wrap;align-items:center;margin-top:18px;color:var(--muted);font-size:13px}
.sw{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
.sw input{display:none}
.sw span{width:34px;height:20px;border-radius:99px;background:#26364e;position:relative;transition:.2s}
.sw span:after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#9db0c9;transition:.2s}
.sw input:checked+span{background:var(--mint)}.sw input:checked+span:after{left:17px;background:#0b1f1a}
.hint{margin-left:auto;font-size:12px;color:#5d6e86}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--mint);color:#0b1f1a;font-weight:700;font-size:13px;padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:820px){.stage{grid-template-columns:1fr}.mid{justify-content:center;margin:-4px 0}.swap{transform:rotate(90deg)}.swap:hover{transform:rotate(270deg)}textarea{min-height:200px}.hint{display:none}}
</style></head>
<body><div class="wrap">
<a class="back" href="../../../">← Back to tools</a>
<header>
  <div class="title"><div class="mark">64</div><div><div class="kicker">DEVELOPER TOOLS</div><h1>Base64</h1></div></div>
  <div class="seg" id="seg" data-mode="encode" role="tablist"><i></i>
    <button role="tab" aria-selected="true" data-m="encode">Encode</button>
    <button role="tab" aria-selected="false" data-m="decode">Decode</button></div>
</header>

<div class="stage">
  <section class="card" id="inCard">
    <div class="chead"><span class="label" id="inLabel">TEXT</span>
      <div class="tools"><button class="chip" id="file">↑ File</button><button class="chip" id="paste">Paste</button><button class="chip" id="clear">Clear</button></div></div>
    <textarea id="inp" spellcheck="false" placeholder="Type or paste text — or drop a file here"></textarea>
    <div class="cfoot"><span id="inStat"><b>0</b> chars</span><span class="msg" id="msg"></span></div>
  </section>
  <div class="mid"><button class="swap" id="swap" title="Swap input and output" aria-label="Swap">⇄</button></div>
  <section class="card">
    <div class="chead"><span class="label" id="outLabel">BASE64</span>
      <div class="tools"><button class="chip" id="dl" disabled>↓ Save</button><button class="chip" id="copy" disabled>Copy</button></div></div>
    <textarea id="out" readonly spellcheck="false" placeholder="Result appears here instantly"></textarea>
    <div class="cfoot"><span id="outStat"><b>0</b> chars</span><span id="ratio"></span></div>
  </section>
</div>

<div class="opts">
  <label class="sw"><input type="checkbox" id="url"><span></span>URL-safe</label>
  <label class="sw"><input type="checkbox" id="wrap"><span></span>Wrap at 76</label>
  <label class="sw"><input type="checkbox" id="pad" checked><span></span>Padding “=”</label>
  <span class="hint">Runs entirely in your browser · nothing is uploaded</span>
</div>
<input type="file" id="fileIn" hidden>
</div><div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const S={mode:"encode",bytes:null,name:""};
const enc=new TextEncoder(),dec=new TextDecoder("utf-8",{fatal:true});
const fmt=n=>n<1024?n+" B":n<1048576?(n/1024).toFixed(1)+" KB":(n/1048576).toFixed(2)+" MB";
function toB64(bytes){let s="";for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));return btoa(s)}
function fromB64(str){const b=atob(str),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function setMode(m){S.mode=m;S.bytes=null;$("seg").dataset.mode=m;document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-selected",b.dataset.m===m));
  $("inLabel").textContent=m==="encode"?"TEXT":"BASE64";$("outLabel").textContent=m==="encode"?"BASE64":"TEXT";
  $("inp").placeholder=m==="encode"?"Type or paste text — or drop a file here":"Paste a Base64 string — or drop a .txt file";run()}
function msg(t,bad){$("msg").textContent=t||"";$("msg").className="msg"+(bad?" bad":"");$("inCard").classList.toggle("err",!!bad)}
function run(){
  const v=$("inp").value;let out="",ok=true;S.out=null;msg("");
  try{
    if(S.mode==="encode"){
      const bytes=S.bytes||enc.encode(v);out=v||S.bytes?toB64(bytes):"";
      if($("url").checked)out=out.replace(/\+/g,"-").replace(/\//g,"_");
      if(!$("pad").checked)out=out.replace(/=+$/,"");
      if($("wrap").checked)out=out.replace(/(.{76})/g,"$1\n").trim();
      $("inStat").innerHTML=S.bytes?`<b>${S.name}</b> · ${fmt(S.bytes.length)}`:`<b>${v.length}</b> chars · ${fmt(bytes.length)}`;
      $("ratio").innerHTML=out&&bytes.length?`<b>+${Math.round((out.length/bytes.length-1)*100)}%</b> size`:"";
    }else{
      let c=v.replace(/\s+/g,"").replace(/-/g,"+").replace(/_/g,"/");
      if(c){if(/[^A-Za-z0-9+/=]/.test(c))throw 0;c=c.replace(/=+$/,"");if(c.length%4===1)throw 0;c+="=".repeat((4-c.length%4)%4);
        const bytes=fromB64(c);S.out=bytes;
        try{out=dec.decode(bytes)}catch(e){out="";msg("Binary data — not text. Use Save to download.")}
        $("ratio").innerHTML=`<b>${fmt(bytes.length)}</b> decoded`}else $("ratio").innerHTML="";
      $("inStat").innerHTML=`<b>${v.length}</b> chars`;
    }
  }catch(e){ok=false;out="";S.out=null;msg("That doesn’t look like valid Base64.",1);$("ratio").innerHTML=""}
  $("out").value=out;$("outStat").innerHTML=`<b>${out.length}</b> chars`;
  const has=!!out||!!S.out;$("copy").disabled=!out;$("dl").disabled=!has||!ok;
}
$("inp").addEventListener("input",()=>{S.bytes=null;run()});
["url","wrap","pad"].forEach(i=>$(i).addEventListener("change",run));
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>setMode(b.dataset.m));
$("swap").onclick=()=>{const o=$("out").value;const m=S.mode==="encode"?"decode":"encode";setMode(m);$("inp").value=o;run()};
$("clear").onclick=()=>{$("inp").value="";S.bytes=null;run();$("inp").focus()};
$("paste").onclick=async()=>{try{$("inp").value=await navigator.clipboard.readText();S.bytes=null;run()}catch(e){toast("Allow clipboard access to paste")}};
$("copy").onclick=async()=>{await navigator.clipboard.writeText($("out").value);toast("Copied to clipboard")};
$("file").onclick=()=>$("fileIn").click();
$("fileIn").onchange=e=>load(e.target.files[0]);
async function load(f){if(!f)return;const buf=new Uint8Array(await f.arrayBuffer());
  if(S.mode==="encode"){S.bytes=buf;S.name=f.name;$("inp").value="";run();$("inp").placeholder=f.name}
  else{$("inp").value=new TextDecoder().decode(buf).trim();run()}}
$("dl").onclick=()=>{let data,name;if(S.mode==="encode"){data=$("out").value;name="encoded.txt"}else{data=S.out;name=S.bytes?S.name:"decoded.bin"}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data]));a.download=name;a.click();URL.revokeObjectURL(a.href)};
const card=$("inCard");
["dragenter","dragover"].forEach(t=>card.addEventListener(t,e=>{e.preventDefault();card.classList.add("drag")}));
["dragleave","drop"].forEach(t=>card.addEventListener(t,e=>{e.preventDefault();card.classList.remove("drag")}));
card.addEventListener("drop",e=>load(e.dataTransfer.files[0]));
let tt;function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),1600)}
run();
</script></body></html>
